name: E2E Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run nightly for regression detection
  schedule:
    - cron: "0 3 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm turbo build

      - name: E2E smoke tests
        # Раньше стояло continue-on-error: true — из-за него workflow месяцами
        # показывал зелёный, хотя падал на servers/_template (нет vitest.e2e.config.ts),
        # и 12 задач не выполнялись вовсе. Тесты работают на подставных ключах,
        # сеть им не нужна: локальный прогон — 61/61.
        run: pnpm turbo test:e2e
