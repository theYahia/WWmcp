name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 dropped: EOL since 2025-04-30, and vitest 4.x (via rolldown)
        # requires node:util.styleText which is Node 20.12+ only.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for Turborepo --filter

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (only affected packages)
        run: pnpm turbo build --filter='...[origin/main]'

      - name: Type check
        run: pnpm turbo typecheck --filter='...[origin/main]'

      - name: Test
        run: pnpm turbo test --filter='...[origin/main]'

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # Full build on main to ensure nothing is broken
  build-all:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo build

      - name: Run all tests
        run: pnpm turbo test
