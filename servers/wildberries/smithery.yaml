name: wildberries-mcp
description: MCP server for Wildberries Seller API — 30 tools across products, prices, stocks, orders, sales, FBS supplies, analytics, feedbacks, questions, returns, ads. Per-category host routing + rate limiting with 409 penalty protection (Russia)
icon: https://raw.githubusercontent.com/theYahia/WWmcp/main/servers/wildberries/assets/icon.svg
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - WB_API_TOKEN
    properties:
      WB_API_TOKEN:
        type: string
        description: "Wildberries Seller API token (Settings → Access to API)"
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@theyahia/wildberries-mcp"],
      env: { WB_API_TOKEN: config.WB_API_TOKEN }
    })
