<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 461" width="800" height="461" role="img" aria-label="Диалог с ИИ: остатки и резервы на складе МойСклад через moysklad-mcp">
  <title>Диалог с ИИ: остатки и резервы на складе МойСклад через moysklad-mcp</title>
  <rect x="1" y="1" width="798" height="459" rx="14" fill="#1B2028" stroke="#333C4A" stroke-width="2"/>
  <path d="M1 56 H799" stroke="#333C4A" stroke-width="1.5"/>
  <g fill="#3C4552"><circle cx="28" cy="28" r="6"/><circle cx="50" cy="28" r="6"/><circle cx="72" cy="28" r="6"/></g>
  <text x="96" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#8B97A8">@theyahia/moysklad-mcp</text>
  <rect x="620" y="15" width="156" height="26" rx="13" fill="#232B36"/>
  <text x="698" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" fill="#8B97A8">данные — пример</text>
  <text x="28" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#8B97A8">Вы</text>
  <text x="28" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#D9E0EA">Сколько футболок на складе и сколько из них в резерве?</text>
  <rect x="16" y="135" width="768" height="44" rx="8" fill="#232B36"/>
  <text x="28" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#5FC29B">→ moysklad-mcp · get_stock(search: "футболка", stock_mode: "positiveOnly", limit: 3)</text>
  <text x="28" y="217" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#8B97A8">Claude</text>
  <text x="28" y="239" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#D9E0EA">Нашлось 3 позиции:</text>
  <text x="28" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B97A8">name</text>
  <text x="300" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B97A8">article</text>
  <text x="480" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B97A8">stock</text>
  <text x="580" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B97A8">reserve</text>
  <path d="M28 286 H772" stroke="#333C4A" stroke-width="1.5"/>
  <text x="28" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">Футболка Basic белая</text>
  <text x="300" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">TS-100-W</text>
  <text x="480" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">42</text>
  <text x="580" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">8</text>
  <text x="28" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">Футболка Basic чёрная</text>
  <text x="300" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">TS-100-B</text>
  <text x="480" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">17</text>
  <text x="580" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">5</text>
  <text x="28" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">Футболка Oversize серая</text>
  <text x="300" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">TS-220-G</text>
  <text x="480" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">3</text>
  <text x="580" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">0</text>
  <text x="28" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#D9E0EA">Свободно к продаже: 34 / 12 / 3 шт.</text>
  <text x="28" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#D9E0EA">TS-220-G пора допроизводить — свободного остатка на 3 заказа.</text>
</svg>
