  <text x="96" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#8B97A8">@theyahia/2gis-mcp</text>
  <rect x="620" y="15" width="156" height="26" rx="13" fill="#232B36"/>
