  <text xml:space="preserve" x="277.6" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">18 402</text>
  <text xml:space="preserve" x="28" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">4407</text>
  <text xml:space="preserve" x="85.6" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">Demo product updates</text>
  <text xml:space="preserve" x="277.6" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">6 118</text>
  <text xml:space="preserve" x="28" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">4390</text>
  <text xml:space="preserve" x="85.6" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#D9E0EA">Example webinar 2026</text>
