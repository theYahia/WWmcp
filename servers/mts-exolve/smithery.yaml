name: mts-exolve-mcp
description: MCP server for MTS Exolve — SMS, calls, recordings, numbers, Viber (Russia)
icon: https://raw.githubusercontent.com/theYahia/WWmcp/main/servers/mts-exolve/assets/icon.svg
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - MTS_EXOLVE_TOKEN
    properties:
      MTS_EXOLVE_TOKEN:
        type: string
        description: "API token from the MTS Exolve dashboard (https://exolve.ru)"
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@theyahia/mts-exolve-mcp"],
      env: { MTS_EXOLVE_TOKEN: config.MTS_EXOLVE_TOKEN }
    })
