startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - domain
    properties:
      domain:
        type: string
        title: Megaplan Domain
        description: "Your Megaplan subdomain (e.g. yourcompany)"
      token:
        type: string
        title: Access Token
        description: "Bearer token from Megaplan API settings"
      login:
        type: string
        title: Login
        description: "Megaplan login (email) — used if no token"
      password:
        type: string
        title: Password
        description: "Megaplan password — used if no token"
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        MEGAPLAN_DOMAIN: config.domain,
        ...(config.token ? { MEGAPLAN_TOKEN: config.token } : {}),
        ...(config.login ? { MEGAPLAN_LOGIN: config.login } : {}),
        ...(config.password ? { MEGAPLAN_PASSWORD: config.password } : {}),
      },
    })
